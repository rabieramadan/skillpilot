# SkillPilot - Nginx Configuration for futurecoverage.ai
# Copy to: C:\nginx-1.28.0\conf\nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Upstream to Waitress server
    upstream skillpilot {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # server {
    #     listen 80;
    #     server_name futurecoverage.ai www.futurecoverage.ai;
    #     return 301 https://$server_name$request_uri;
    # }

    # Main server block
    server {
        listen 80;
        # listen 443 ssl;  # Uncomment for HTTPS
        server_name futurecoverage.ai www.futurecoverage.ai;

        # SSL Configuration (uncomment and update paths for HTTPS)
        # ssl_certificate     C:/nginx-1.28.0/ssl/futurecoverage.crt;
        # ssl_certificate_key C:/nginx-1.28.0/ssl/futurecoverage.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        # Logs
        access_log logs/skillpilot_access.log;
        error_log  logs/skillpilot_error.log;

        # Static files - served directly by nginx for better performance
        location /static/ {
            alias C:/Futurecoverage/skillpilot/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Uploaded files
        location /uploads/ {
            alias C:/Futurecoverage/skillpilot/uploads/;
            expires 1d;
        }

        # All other requests go to Flask/Waitress
        location / {
            proxy_pass http://skillpilot;
            proxy_http_version 1.1;
            
            # Headers for Flask
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
