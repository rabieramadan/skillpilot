<!DOCTYPE html>
<html lang="en" data-skp-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SkillPilot{% endblock %}</title>
  <script>
    window.APP_BASE_URL = '{{ request.script_root }}' || '';
    (function () {
      const original = window.fetch;
      window.fetch = function (url, opts) {
        if (typeof url === 'string' && url.startsWith('/') && !url.startsWith('//')) {
          url = window.APP_BASE_URL + url;
        }
        return original.call(this, url, opts);
      };
    })();
  </script>
  <script>
    /* Shared helpers, defined before any page script so a page that uses them
       while its own <script> is parsing does not fail. */
    // HTML-escape any string before interpolating it into innerHTML.
    window.escHtml = function (v) {
      if (v == null) return '';
      return String(v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
    // Safe URL: blocks javascript:, data:, vbscript: schemes; HTML-escapes the rest.
    window.safeUrl = function (v) {
      const s = (v == null ? '' : String(v)).trim();
      if (/^(javascript|data|vbscript):/i.test(s)) return '#';
      return window.escHtml(s);
    };

    window.skpToast = function (msg, kind) {
      const t = document.createElement('div');
      t.className = 'skp-toast';
      if (kind === 'error') t.style.background = 'var(--skp-danger)';
      if (kind === 'success') t.style.background = 'var(--skp-success)';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    };
  </script>
  {% include '_pwa_meta.html' %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/advanced.css') }}">
  <style>
    body { margin: 0; background: var(--skp-bg, #f5f7fa); }
    .skp-appbar__brand { display:flex; align-items:center; gap: var(--skp-s-3); font-weight: 700; color: var(--skp-text); text-decoration: none; }
    /* Slot the global top-cards menu inside the appbar so all pages share
       the same chrome as the main /app page. */
    .skp-appbar { gap: 12px; align-items: center; flex-wrap: wrap; }
    .skp-appbar .skp-top-menu { flex: 1 1 auto; min-width: 0; box-shadow: none; padding: 4px 6px; background: transparent; }
    .skp-appbar .skp-top-menu a.menu-item { color: #374151; text-decoration: none; }
    .skp-appbar .skp-top-menu a.menu-item:hover { background: #f3f4f6; color: #111827; }
    .skp-main { padding: var(--skp-s-8) 0; }
    .skp-row { display:flex; align-items:center; gap: var(--skp-s-3); flex-wrap: wrap; }
    .skp-spacer { flex: 1; }
    .skp-table { width:100%; border-collapse: collapse; font-size: var(--skp-fs-sm); }
    .skp-table th, .skp-table td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--skp-border); }
    .skp-table th { color: var(--skp-text-subtle); font-weight: 600; text-transform: uppercase; font-size: var(--skp-fs-xs); letter-spacing: 0.04em; }
    .skp-form-row { display:grid; gap: var(--skp-s-2); margin-bottom: var(--skp-s-4); }
    .skp-stack > * + * { margin-top: var(--skp-s-4); }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
  <script src="{{ url_for('static', filename='js/skp-safe.js') }}"></script>
  {% block head_extra %}{% endblock %}
</head>
<body data-skp-modern>
  <header class="skp-appbar">
    <a class="skp-appbar__brand" href="{{ url_for('main.app_page') }}" data-testid="link-brand">
      <i class="fas fa-graduation-cap" style="color: var(--skp-brand);"></i>
      <span>SkillPilot</span>
    </a>
    {% include '_top_menu.html' %}
    <div class="skp-row">
      <button class="skp-btn skp-btn--ghost skp-btn--sm" id="skpLangToggle" data-testid="button-lang-toggle">
        <i class="fas fa-globe"></i> <span id="skpLangLabel">العربية</span>
      </button>
    </div>
  </header>

  <main class="skp-main">
    <div class="skp-container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    (function () {
      const STR = window.SKP_I18N || {};
      function applyLang(lang) {
        const html = document.documentElement;
        html.setAttribute('lang', lang);
        html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        const label = document.getElementById('skpLangLabel');
        if (label) label.textContent = lang === 'ar' ? 'English' : 'العربية';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          const dict = STR[lang] || {};
          if (dict[key]) el.textContent = dict[key];
        });
        try { localStorage.setItem('skp_lang', lang); } catch (e) {}
        window.SKP_LANG = lang;
        document.dispatchEvent(new CustomEvent('skp:lang', { detail: { lang } }));
      }
      window.skpApplyLang = applyLang;
      const initial = (function () { try { return localStorage.getItem('skp_lang') || 'en'; } catch (e) { return 'en'; } })();
      applyLang(initial);
      const btn = document.getElementById('skpLangToggle');
      if (btn) btn.addEventListener('click', () => applyLang(window.SKP_LANG === 'ar' ? 'en' : 'ar'));
      // mark active link
      document.querySelectorAll('.skp-appbar__nav a').forEach(a => {
        if (a.getAttribute('href') === window.location.pathname) a.classList.add('active');
      });
    })();

  </script>
  {% block body_extra %}{% endblock %}
</body>
</html>
