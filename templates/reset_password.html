<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — SkillPilot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
           background: linear-gradient(135deg,#0f3a3c 0%, #1a5c5e 60%, #d4af37 140%);
           display:flex; align-items:center; justify-content:center; padding:24px; color:#1f2937; }
    .card { background:#fff; border-radius:14px; padding:32px; max-width:440px; width:100%;
            box-shadow: 0 24px 60px rgba(0,0,0,.18); }
    h1 { margin:0 0 6px; font-size:22px; color:#0f3a3c; }
    p.sub { margin:0 0 22px; color:#4b5563; font-size:14px; }
    label { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; color:#1f2937; }
    input[type=password] { width:100%; padding:11px 13px; border:1px solid #d1d5db; border-radius:8px;
                            font-size:15px; outline:none; transition: border-color .15s; }
    input[type=password]:focus { border-color:#1a5c5e; box-shadow: 0 0 0 3px rgba(26,92,94,.15); }
    button { width:100%; margin-top:20px; padding:12px 16px; border:0; border-radius:8px;
             background:#1a5c5e; color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
    button:hover { background:#134548; }
    button[disabled] { opacity:.6; cursor:not-allowed; }
    .alert { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:14px; display:none; }
    .alert.error { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .alert.success { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .alert.show { display:block; }
    .help { font-size:12px; color:#6b7280; margin-top:6px; }
    .links { margin-top:20px; text-align:center; font-size:13px; }
    .links a { color:#1a5c5e; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1><i class="fas fa-key" style="color:#d4af37;margin-right:8px;"></i>Choose a new password</h1>
    <p class="sub">Your reset link is valid for one hour. Pick a strong password you don't use anywhere else.</p>

    <form id="resetForm" autocomplete="off">
      <input type="hidden" id="token" value="{{ token|e }}">

      <label for="pw1">New password</label>
      <input type="password" id="pw1" minlength="8" required autocomplete="new-password" data-testid="input-new-password">
      <div class="help">At least 8 characters.</div>

      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" minlength="8" required autocomplete="new-password" data-testid="input-confirm-password">

      <button type="submit" id="submitBtn" data-testid="button-reset-password">
        <i class="fas fa-check"></i> Reset password
      </button>

      <div class="alert error" id="errBox" data-testid="alert-error"></div>
      <div class="alert success" id="okBox" data-testid="alert-success"></div>
    </form>

    <div class="links">
      <a href="/skillpilot-landing">Back to sign in</a>
    </div>
  </div>

<script>
(function(){
  const form = document.getElementById('resetForm');
  const token = document.getElementById('token').value.trim();
  const errBox = document.getElementById('errBox');
  const okBox  = document.getElementById('okBox');
  const btn    = document.getElementById('submitBtn');

  function showErr(msg){ errBox.textContent = msg; errBox.classList.add('show'); okBox.classList.remove('show'); }
  function showOk(msg){  okBox.textContent  = msg; okBox.classList.add('show');  errBox.classList.remove('show'); }

  if (!token) { showErr('This reset link is missing its token. Request a new link from the sign-in page.'); }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errBox.classList.remove('show'); okBox.classList.remove('show');
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    if (pw1.length < 8) return showErr('Password must be at least 8 characters.');
    if (pw1 !== pw2)    return showErr('The two passwords do not match.');
    if (!token)         return;

    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting…';
    try {
      const r = await fetch('/api/auth/reset-password', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token: token, new_password: pw1 })
      });
      const data = await r.json().catch(()=>({}));
      if (!r.ok || data.error) {
        showErr(data.error || 'Could not reset your password. The link may have expired.');
      } else {
        showOk('Password updated. Redirecting you to sign in…');
        setTimeout(()=>{ window.location.href = '/skillpilot-landing'; }, 1800);
      }
    } catch (err) {
      showErr('Network error. Please try again.');
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Reset password';
    }
  });
})();
</script>
</body>
</html>
