# SkillPilot LMS - Nginx Configuration for Windows
# Optimized for 500+ concurrent users
# Place this in your nginx/conf folder

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log logs/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Connection limits for high load
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # Upstream servers (load balancing across multiple Waitress instances)
    upstream skillpilot_backend {
        least_conn;
        server 127.0.0.1:5001 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5002 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5003 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5004 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;
        
        # For production, use your domain:
        # server_name yourdomain.com www.yourdomain.com;

        # Connection limits
        limit_conn conn_limit 20;
        limit_req zone=req_limit burst=20 nodelay;

        # Client body size for file uploads
        client_max_body_size 50M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # Static files (served directly by nginx - faster)
        location /static/ {
            alias C:/SkillPilot/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Uploaded files
        location /uploads/ {
            alias C:/SkillPilot/uploads/;
            expires 1d;
            add_header Cache-Control "public";
        }

        # API and dynamic content - proxy to Python backend
        location / {
            proxy_pass http://skillpilot_backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://skillpilot_backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # HTTPS configuration (uncomment for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #     
    #     ssl_certificate C:/SkillPilot/certs/fullchain.pem;
    #     ssl_certificate_key C:/SkillPilot/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # ... same location blocks as above ...
    # }
}
