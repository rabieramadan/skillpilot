# SkillPilot configuration
#
# Model identifiers live in app/services/model_registry.py, which is the
# single source of truth. The `models:` block below only *overrides* the
# default for a provider — leave an entry out and the registry default is
# used, which is what you want unless you have a reason to pin a version.
#
# Precedence, highest first:
#   1. SKILLPILOT_MODEL_<PROVIDER> environment variable
#   2. models.<provider>.default_model here
#   3. the registry default
#
# A retired identifier written here is mapped to its replacement rather than
# failing, so an old config file will not take the site down.

# API Keys — DO NOT put secrets here. Leave blank and load from environment
# variables (.env) or the in-app Admin > AI Settings screen. Any non-empty
# value is treated as a local-development fallback only.
api_keys:
  openai: ""        # env: OPENAI_API_KEY
  claude: ""        # env: ANTHROPIC_API_KEY or CLAUDE_API_KEY
  gemini: ""        # env: GEMINI_API_KEY
  grok: ""          # env: XAI_API_KEY or GROK_API_KEY
  deepseek: ""      # env: DEEPSEEK_API_KEY
  perplexity: ""    # env: PERPLEXITY_API_KEY
  census: ""        # env: CENSUS_API_KEY
  dify: ""          # env: DIFY_API_KEY (Applications -> Access API)
  heygen: ""        # env: HEYGEN_API_KEY
  bedrock: ""       # env: BEDROCK_API_KEY, as access_key|secret_key|region

# Model overrides. Catalogue reviewed 14 September 2026.
models:
  openai:
    # gpt-6-astra (flagship) | gpt-5.6-sol | gpt-5.6-terra | gpt-5.6-luna
    default_model: "gpt-5.6-terra"
    max_tokens: 16000

  claude:
    # claude-opus-5 | claude-sonnet-5 | claude-haiku-4-5
    default_model: "claude-sonnet-5"
    max_tokens: 8000

  gemini:
    # gemini-3.1-pro | gemini-3.8-flash | gemini-3.7-flash | gemini-3.5-flash-lite
    default_model: "gemini-3.8-flash"
    max_tokens: 8000

  grok:
    # grok-4.6 | grok-4.5 | grok-4.3
    default_model: "grok-4.6"
    max_tokens: 8000

  deepseek:
    # deepseek-v4-flash | deepseek-v4-pro
    default_model: "deepseek-v4-flash"
    max_tokens: 8000

  perplexity:
    # sonar | sonar-pro | sonar-reasoning | sonar-reasoning-pro | sonar-deep-research
    default_model: "sonar-pro"
    max_tokens: 8000

  images:
    # gpt-image-2 | gpt-image-1.5 | gpt-image-1-mini
    # The DALL-E endpoints were shut down on 12 May 2026.
    default_model: "gpt-image-2"
    size: "1024x1024"
    quality: "high"

  bedrock:
    # Claude on AWS Bedrock. Requires BEDROCK_API_KEY.
    default_model: "anthropic.claude-sonnet-5"
    max_tokens: 8000

# File Upload Settings
files:
  max_size_mb: 50
  allowed_extensions:
    documents:
      - pdf
      - doc
      - docx
      - txt
      - rtf
      - odt
    spreadsheets:
      - xls
      - xlsx
      - csv
      - ods
    presentations:
      - ppt
      - pptx
      - odp
    images:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - webp
      - svg
      - tiff
    data:
      - json
      - xml
      - yaml
      - yml
    code:
      - py
      - js
      - ts
      - jsx
      - tsx
      - java
      - cpp
      - c
      - h
      - cs
      - rb
      - go
      - rs
      - php
      - html
      - css
      - sql
    archives:
      - zip
      - tar
      - gz
  
  # Maximum content to extract per file (characters)
  max_content_length: 50000

# Application Settings
app:
  debug: true
  enable_streaming: true
  enable_conversation_history: true
  max_conversation_length: 50
  enable_prompt_templates: true
  enable_model_comparison: true
  enable_cost_tracking: true
  
# Admin Authentication
admin:
  # Super-admin password. Set ADMIN_PASSWORD in .env instead of putting it
  # here — this file is committed to version control. Leaving it blank
  # disables password-only super-admin login entirely.
  password: ""
  session_timeout: 3600  # Session timeout in seconds (1 hour)

# Prompt Engineering Features
prompt_engineering:
  # Enable system prompts
  enable_system_prompts: true
  
  # Default system prompts for different use cases
  default_system_prompts:
    general: "You are a helpful AI assistant."
    teaching: "You are an expert educator helping students learn about prompt engineering. Provide detailed explanations and examples."
    analysis: "You are a data analyst. Provide thorough analysis with insights and recommendations."
    coding: "You are an expert programmer. Provide well-commented code with explanations."
    creative: "You are a creative assistant. Think outside the box and provide innovative ideas."
  
  # Prompt templates for training
  templates_enabled: true
  
  # Advanced parameters
  allow_temperature_control: true
  allow_top_p_control: true
  allow_frequency_penalty: true
  allow_presence_penalty: true

# Response Enhancement
responses:
  include_metadata: true  # Include tokens, cost, model info
  include_thinking_process: false  # Show model's reasoning (if supported)
  format_code_blocks: true
  highlight_syntax: true